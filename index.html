<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CoreHoot</title>
<meta name="description" content="CoreHoot: conócete, entiende cómo amas y construye mejores relaciones. Quizzes interactivos sobre relaciones afectivas para jóvenes. Proyecto Core II, Universidad de La Sabana.">
<meta property="og:title" content="CoreHoot!">
<meta property="og:description" content="Conócete. Reflexiona. Ama mejor. Seis módulos interactivos sobre relaciones afectivas.">
<meta name="theme-color" content="#120a29">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: a night-sky "game show" — one centered stage over a drifting starfield; Kahoot-style answer tiles; modules are stars in a constellation. Single dark world by design (CoreHoot brand). */
:root{
  color-scheme: dark;
  --bg:#120a29; --bg2:#1c1040; --panel:rgba(255,255,255,.06); --panel2:rgba(255,255,255,.1);
  --line:rgba(226,214,255,.16); --fg:#f6f1ff; --muted:#bfb2e0; --dim:#8f82b5;
  --red:#e21b3c; --blue:#1368ce; --yellow:#e2a400; --green:#26890c; --violet:#8a5cff; --teal:#0d9aa8;
  --gold:#ffd166; --ok:#3ccf6e; --warn:#ff8a3d; --ink:#1b1033;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{position:fixed;inset:-20% -10% auto -10%;height:80vh;z-index:0;pointer-events:none;background:radial-gradient(60% 60% at 30% 30%,rgba(138,92,255,.28),transparent 70%),radial-gradient(50% 50% at 80% 20%,rgba(19,104,206,.18),transparent 70%)}
.shell{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(18,10,41,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.logo{font-family:var(--display);font-size:28px;letter-spacing:.5px;color:var(--fg);text-decoration:none;line-height:1;display:flex;align-items:center;gap:8px}
.logo b{color:var(--gold);font-weight:400}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{color:var(--muted);text-decoration:none;font-weight:800;font-size:14px;padding:8px 12px;border-radius:999px}
nav.main a:hover{color:var(--fg);background:var(--panel)}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--fg)}
.pts{font-weight:900;font-size:14px;color:var(--gold);padding:6px 10px;border:1px solid rgba(255,209,102,.35);border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--panel2)}
main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
footer.foot{position:relative;z-index:1;border-top:1px solid var(--line);color:var(--dim);font-size:13px}
footer .in{max-width:1040px;margin:0 auto;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.3px;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,58px)}
h2{font-size:clamp(26px,4vw,36px)}
h3{font-size:22px}
p{margin:0}
.lead{font-size:18px;color:var(--muted);max-width:60ch}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.stack>*,.grid2>*,.grid3>*,.grid4>*{min-width:0}
.tablewrap{max-width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.btn{font-family:var(--body);font-weight:900;font-size:16px;border:0;border-radius:12px;padding:13px 22px;cursor:pointer;color:var(--ink);background:var(--fg);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s ease, box-shadow .08s ease;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.small{font-size:14px;padding:9px 14px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=text],textarea{width:100%;font-family:var(--body);font-size:16px;color:var(--fg);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--dim)}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.src{font-size:12px;color:var(--dim);font-style:italic}

/* Owl */
.owl{width:84px;height:84px;flex:none}
.owl .lid{transform-origin:center;animation:blink 5s infinite}
.owl.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.speech{position:relative;background:var(--fg);color:var(--ink);border-radius:16px;padding:12px 16px;font-weight:700;max-width:52ch}
.speech::before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-left:0;border-right-color:var(--fg)}
.hoot{display:flex;gap:12px;align-items:flex-start}

/* Lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.lobby{grid-template-columns:minmax(0,1fr)}}
.wordmark{font-family:var(--display);font-size:clamp(56px,11vw,112px);line-height:.9;letter-spacing:1px;text-shadow:0 6px 0 rgba(0,0,0,.35)}
.wordmark b{color:var(--gold);font-weight:400}
.pin{background:var(--fg);color:var(--ink);border-radius:18px;padding:22px;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.pin h3{color:var(--ink)}
.pin input[type=text]{background:#fff;color:var(--ink);border:2px solid #d9d0f0;font-weight:800;font-size:18px;text-align:center}
.pin input::placeholder{color:#9b90b8}
.opt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt button{font-family:var(--body);font-weight:800;font-size:14px;border:2px solid #d9d0f0;background:#fff;color:var(--ink);border-radius:12px;padding:10px;cursor:pointer;text-align:left}
.opt button[aria-pressed="true"]{border-color:var(--violet);background:#efe8ff}
.cycle{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.cycle span{padding:6px 10px;border-radius:8px;color:#fff}
.cycle i{font-style:normal;color:var(--dim)}

/* Map */
.mapwrap{position:relative;background:radial-gradient(80% 80% at 50% 40%,rgba(138,92,255,.18),transparent 70%);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.mapwrap>svg{display:block;width:100%;height:auto}
.mapwrap .star{cursor:pointer}
.mapwrap .star:focus-visible{outline:none}
.mapwrap .star:focus-visible circle.halo{stroke:var(--gold);stroke-width:3}
.modcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--fg);position:relative;overflow:hidden;transition:transform .12s ease}
.modcard:hover{transform:translateY(-3px)}
.modcard .band{height:6px;border-radius:6px}
.modcard .top{display:flex;align-items:center;gap:10px}
.done-pill{font-size:12px;font-weight:900;color:var(--ink);background:var(--gold);padding:3px 9px;border-radius:999px}
.shape{width:30px;height:30px;flex:none}

/* Quiz */
.stage{display:flex;flex-direction:column;gap:18px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden;flex:1;min-width:120px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .4s ease}
.qcard{background:var(--fg);color:var(--ink);border-radius:18px;padding:clamp(18px,4vw,30px);box-shadow:0 8px 0 rgba(0,0,0,.35);text-align:center}
.qcard .qk{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#6b5aa0;margin-bottom:6px}
.qcard .qt{font-family:var(--display);font-size:clamp(22px,3.6vw,32px);line-height:1.15;text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tiles.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.n5{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.tiles,.tiles.n3,.tiles.n5{grid-template-columns:minmax(0,1fr)}}
.tile{position:relative;display:flex;align-items:center;gap:14px;text-align:left;min-height:84px;border:0;border-radius:14px;padding:16px 18px;color:#fff;font-family:var(--body);font-size:17px;font-weight:800;line-height:1.3;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .1s ease,opacity .3s ease,filter .3s ease}
.tile:hover{transform:translateY(-2px);filter:brightness(1.08)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.tile svg{width:30px;height:30px;flex:none}
.tile.c0{background:var(--red)} .tile.c1{background:var(--blue)} .tile.c2{background:var(--yellow);color:#2a1700} .tile.c3{background:var(--green)} .tile.c4{background:var(--violet)}
.tile.cg{background:var(--green)} .tile.cy{background:var(--yellow);color:#2a1700} .tile.cr{background:var(--red)}
.tiles.answered .tile{cursor:default;pointer-events:none}
.tiles.answered .tile:not(.picked){opacity:.28;filter:saturate(.4)}
.tile.picked{transform:scale(1.02);box-shadow:0 0 0 4px var(--fg),0 5px 0 rgba(0,0,0,.35)}
.tile .mark{margin-left:auto;font-family:var(--display);font-size:22px}
.tiles.answered .tile.right{opacity:1;filter:none}
.reveal{border-radius:16px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start;animation:pop .35s ease}
.reveal.good{background:rgba(60,207,110,.14);border:1px solid rgba(60,207,110,.5)}
.reveal.bad{background:rgba(255,138,61,.12);border:1px solid rgba(255,138,61,.5)}
.reveal.info{background:var(--panel);border:1px solid var(--line)}
.reveal h3{font-size:20px;margin-bottom:4px}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
.order-slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:12px;min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:8px 14px;font-weight:800}
.slot b{font-family:var(--display);font-size:22px;color:var(--gold);width:24px}
.slot.filled{border-style:solid;background:var(--panel)}
.slot.ok{border-color:var(--ok)} .slot.no{border-color:var(--warn)}
.scale{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.scale button{width:58px;height:58px;border-radius:50%;border:0;font-family:var(--display);font-size:24px;cursor:pointer;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.scale-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700;max-width:360px;margin:0 auto;width:100%}

/* Countdown */
.count{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(18,10,41,.86)}
.count b{font-family:var(--display);font-size:min(40vw,240px);color:var(--fg);animation:zoom .9s ease}
@keyframes zoom{from{transform:scale(1.8);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:1}}

/* Results */
.resulthero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.resulthero .big{font-family:var(--display);font-size:clamp(36px,7vw,64px);line-height:1;color:var(--gold);text-shadow:0 5px 0 rgba(0,0,0,.35);animation:pop .6s ease}
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 46px;gap:10px;align-items:center;font-weight:800;font-size:14px}
.brow .track{height:14px;background:var(--panel2);border-radius:999px;overflow:hidden}
.brow .track i{display:block;height:100%;border-radius:999px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.brow span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:480px){.brow{grid-template-columns:minmax(0,1fr) 46px}.brow .track{grid-column:1/-1;order:3}}
.kv{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.kv div{border-left:3px solid var(--gold);padding-left:12px}
.kv dt{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:2px 0 0;font-weight:700}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--panel);color:var(--dim)}
.steps span.on{background:var(--gold);color:var(--ink)}
.steps span.past{color:var(--fg);background:var(--panel2)}
.lesson{min-height:220px;display:flex;flex-direction:column;gap:12px;animation:pop .3s ease}
.lesson .n{font-family:var(--display);font-size:16px;color:var(--gold)}
.lesson p{font-size:17px;max-width:62ch}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--panel2)}
.dots i.on{background:var(--gold)}
.ai{white-space:pre-wrap;line-height:1.6}
.badge{width:120px;height:120px;animation:spin-in .9s cubic-bezier(.2,.8,.2,1)}
@keyframes spin-in{from{transform:rotate(-200deg) scale(.2);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--ink);font-weight:900;padding:12px 18px;border-radius:12px;box-shadow:0 6px 0 rgba(0,0,0,.35);animation:pop .3s ease;max-width:calc(100% - 32px)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:55}
table.ref{width:100%;border-collapse:collapse;font-size:14px}
.tablewrap{overflow-x:auto}
table.ref td,table.ref th{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
table.ref th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.refs p{overflow-wrap:anywhere;padding-left:2em;text-indent:-2em;font-size:15px;color:var(--muted)}
.refs p i{color:var(--fg)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--gold);flex:none}
.check.donec span{text-decoration:line-through;color:var(--dim)}
.stars5{display:flex;gap:6px}
.stars5 button{background:none;border:0;cursor:pointer;font-size:30px;color:var(--panel2);padding:0 2px;line-height:1}
.stars5 button.on{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas><div class="glow" aria-hidden="true"></div>
<div class="shell">
<header class="top"><div class="topin">
  <a class="logo" href="#inicio" aria-label="CoreHoot, inicio">Core<b>Hoot!</b></a>
  <nav class="main" aria-label="Principal"><a href="#inicio" data-v="inicio">Mapa</a><a href="#perfil" data-v="perfil">Mi perfil</a><a href="#proyecto" data-v="proyecto">Sobre CoreHoot</a></nav>
  <span class="pts" id="pts" title="Puntos de autoconocimiento">✦ 0</span>
  <button class="iconbtn" id="snd" type="button"></button>
</div></header>
<main id="app" aria-live="polite"></main>
<footer class="foot"><div class="in"><span><b style="font-family:var(--display);font-weight:400;color:var(--fg)">CoreHoot!</b> · Conócete. Reflexiona. Ama mejor.</span><span>Proyecto Core II · Persona y Afectividad · Universidad de La Sabana</span></div></footer>
</div>
<script>
/* ===================== CONTENIDO ===================== */
const REFS = {

  illouz:"Illouz, E. (2012). <i>Por qué duele el amor: Una explicación sociológica</i>. Katz Editores.",
  mcginnis:"McGinnis, P. J. (2020). <i>Fear of missing out: Practical decision-making in a world of overwhelming choice</i>. Sourcebooks.",
  rojasLight:"Rojas, E. (1992). <i>El hombre light: Una vida sin valores</i>. Temas de Hoy.",

  waldinger:"Waldinger, R. (2015). <i>What makes a good life? Lessons from the longest study on happiness</i> [Video]. TED Conferences. https://www.ted.com/talks/robert_waldinger_what_makes_a_good_life_lessons_from_the_longest_study_on_happiness",
  yepes:"Yepes, R., & Aranguren, J. (2003). <i>Fundamentos de antropología: Un ideal de la excelencia humana</i> (6.ª ed.). EUNSA."
};

const ATTACH = {
  S:{name:"Apego seguro",color:"var(--green)",

  const f=`fill="${fill}"`;
  const m={tri:`<path d="M16 4 L29 27 L3 27 Z" ${f}/>`,dia:`<path d="M16 2 L30 16 L16 30 L2 16 Z" ${f}/>`,cir:`<circle cx="16" cy="16" r="13" ${f}/>`,
    sq:`<rect x="4" y="4" width="24" height="24" rx="3" ${f}/>`,hex:`<path d="M9 4 H23 L30 16 L23 28 H9 L2 16 Z" ${f}/>`,
    wave:`<path d="M2 12 Q9 4 16 12 T30 12 V27 H2 Z" ${f}/>`,star:`<path d="M16 2 L20 12 L30 12 L22 19 L25 30 L16 23 L7 30 L10 19 L2 12 L12 12 Z" ${f}/>`};
  return `<svg class="${cls}" viewBox="0 0 32 32" aria-hidden="true">${m[k]||m.cir}</svg>`;
}
const TILESH=["tri","dia","cir","sq","star"];
function owl(cls="owl bob",mood=""){
  const eye=(cx)=>`<circle cx="${cx}" cy="50" r="17" fill="#fff"/><circle cx="${cx+(mood==="look"?4:0)}" cy="${mood==="happy"?48:52}" r="8" fill="#1b1033"/><circle cx="${cx+3}" cy="48" r="2.6" fill="#fff"/><rect class="lid" x="${cx-18}" y="33" width="36" height="34" rx="17" fill="#7b55e0"/>`;
  return `<svg class="${cls}" viewBox="0 0 120 120" aria-hidden="true">
  <path d="M24 22 L40 38 L30 44 Z" fill="#6a46d6"/><path d="M96 22 L80 38 L90 44 Z" fill="#6a46d6"/>
  <rect x="20" y="26" width="80" height="84" rx="38" fill="#7b55e0"/>
  <ellipse cx="60" cy="84" rx="26" ry="22" fill="#b9a2ff"/>
  <path d="M48 80 q4 4 8 0 M58 88 q4 4 8 0 M50 96 q4 4 8 0 M64 78 q4 4 8 0" stroke="#7b55e0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  ${eye(42)}${eye(78)}
  <path d="M55 62 L65 62 L60 72 Z" fill="#ffd166"/>
  ${mood==="happy"?'<circle cx="30" cy="68" r="5" fill="#ff7aa8" opacity=".6"/><circle cx="90" cy="68" r="5" fill="#ff7aa8" opacity=".6"/>':""}
  <path d="M40 110 l-4 6 M48 110 l0 7 M72 110 l0 7 M80 110 l4 6" stroke="#ffd166" stroke-width="4" stroke-linecap="round"/></svg>`;
}
function hoot(msg,mood){return `<div class="hoot">${owl("owl bob",mood)}<div class="speech">${msg}</div></div>`;}

/* ---------- Sonido ---------- */
let AC=null;
function beep(f=660,d=.12,type="sine",v=.08,delay=0){
  if(!S.sound) return; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const SFX={tap:()=>beep(520,.08,"triangle"),good:()=>{beep(660,.1,"triangle");beep(880,.16,"triangle",.08,.1)},bad:()=>{beep(300,.18,"sawtooth",.04)},
  tick:()=>beep(440,.1,"square",.04),go:()=>beep(880,.25,"square",.05),win:()=>{[523,659,784,1046].forEach((f,i)=>beep(f,.22,"triangle",.07,i*.12))}};

/* ---------- Utilidades UI ---------- */
function toast(t){const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2400);}
function addPts(n){S.points=(S.points||0)+n;save();const p=$("#pts");if(p)p.textContent="✦ "+S.points.toLocaleString("es-CO");}
function copyText(txt){
  const done=()=>toast("Copiado. Ya puedes pegarlo donde quieras.");
  const fallback=()=>{const ta=$("#copybox");if(ta){ta.hidden=false;ta.value=txt;ta.focus();ta.select();toast("Selecciona y copia el texto del recuadro.");}};
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback);} else fallback(); }catch(e){fallback();}
}
function confetti(){
  if(reduce) return; const c=document.createElement("canvas");c.className="confetti";document.body.appendChild(c);
  const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#e21b3c","#1368ce","#e2a400","#26890c","#ffd166","#8a5cff"];
  const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,s:Math.random()*8+4,c:cols[Math.random()*6|0],r:Math.random()*6,k:Math.random()*4|0}));
  let t=0;(function fr(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
    if(p.k===0){x.beginPath();x.arc(0,0,p.s/2,0,6.3);x.fill();}else x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});
    if(++t<110)requestAnimationFrame(fr);else c.remove();})();
}

/* ---------- Cielo ---------- */
(function sky(){
  const c=$("#sky"),x=c.getContext("2d");let st=[],w,h;
  function rs(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;st=Array.from({length:Math.min(220,(innerWidth*innerHeight)/7000|0)},()=>({x:Math.random()*w,y:Math.random()*h,r:(Math.random()*1.3+.3)*devicePixelRatio,p:Math.random()*6.3,s:Math.random()*.02+.005}));}
  function draw(tw){x.clearRect(0,0,w,h);st.forEach(s=>{const a=.35+.65*Math.abs(Math.sin(s.p+tw*s.s));x.globalAlpha=a;x.fillStyle="#efe6ff";x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill();if(!reduce){s.y-=.04*devicePixelRatio;if(s.y<0)s.y=h;}});}
  rs();addEventListener("resize",rs);if(reduce){draw(0);return;}let t=0;(function lp(){t++;draw(t);requestAnimationFrame(lp);})();
})();

function route(){
  const h=(location.hash||"#inicio").slice(1);
  if(!S.profile && h!=="proyecto") return lobby();
  if(h.startsWith("m-")&&MOD[h.slice(2)]) return startModule(h.slice(2));
  if(h==="perfil") return profile();

  return home();
}

/* ---------- Constelación ---------- */
const POS={apego:[140,150],lenguajes:[310,80],noviazgo:[480,175],matrimonio:[660,95],sexualidad:[600,310],liquidas:[300,300]};
const LINKS=[["apego","lenguajes"],["lenguajes","noviazgo"],["noviazgo","matrimonio"],["matrimonio","sexualidad"],["sexualidad","liquidas"],["liquidas","apego"],["noviazgo","liquidas"]];
function constellation(){
  let bg="";for(let i=0;i<60;i++){bg+=`<circle cx="${(i*137)%800}" cy="${(i*89)%420}" r="${(i%3)*.6+.6}" fill="#efe6ff" opacity="${.15+(i%5)*.08}"/>`;}
  const ln=LINKS.map(([a,b])=>{const on=S.mods[a]&&S.mods[b];return `<line x1="${POS[a][0]}" y1="${POS[a][1]}" x2="${POS[b][0]}" y2="${POS[b][1]}" stroke="${on?"#ffd166":"rgba(226,214,255,.22)"}" stroke-width="${on?2.5:1.5}" stroke-dasharray="${on?"":"4 6"}"/>`;}).join("");
  const nodes=MODS.map(m=>{const [x,y]=POS[m.id];const done=!!S.mods[m.id];
    return `<g class="star" tabindex="0" role="link" aria-label="Módulo ${esc(m.name)}${done?" (completado)":""}" data-go="m-${m.id}">
      <circle class="halo" cx="${x}" cy="${y}" r="38" fill="${done?m.color:"rgba(255,255,255,.04)"}" stroke="${m.color}" stroke-width="2.5" opacity="${done?1:.95}">${(!done&&!reduce)?`<animate attributeName="r" values="36;40;36" dur="3s" repeatCount="indefinite"/>`:""}</circle>
      <g transform="translate(${x-16},${y-16})">${shape(m.shape,done?"#fff":m.color,"").replace('<svg class=""','<svg width="32" height="32"')}</g>
      <text x="${x}" y="${y+62}" text-anchor="middle" fill="#f6f1ff" style="font:22px var(--display)">${esc(m.name)}</text>
      ${done?`<text x="${x}" y="${y+84}" text-anchor="middle" fill="#ffd166" style="font:800 14px var(--body)">${esc(S.mods[m.id].res.title)}</text>`:`<text x="${x}" y="${y+84}" text-anchor="middle" fill="#bfb2e0" style="font:700 13px var(--body)">${m.time}</text>`}
    </g>`;}).join("");
  return `<div class="mapwrap"><svg viewBox="0 0 800 420" role="img" aria-label="Mapa de módulos de CoreHoot">${bg}${ln}${nodes}</svg></div>`;
}
function bindStars(root=app){root.querySelectorAll("[data-go]").forEach(n=>{n.addEventListener("click",()=>{SFX.tap();go(n.dataset.go);});n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go(n.dataset.go);}});});}

/* ---------- Recomendación ---------- */
const FIRST={entender:"apego",relacion:"lenguajes",curiosidad:"liquidas",clase:"noviazgo"};
function recommend(){
  const undone=MODS.filter(m=>!S.mods[m.id]); if(!undone.length) return null;
  const last=Object.entries(S.mods).sort((a,b)=>b[1].date-a[1].date)[0];
  if(last){const n=nextFor(last[0],last[1].res);if(n&&!S.mods[n.id])return n;}
  const f=MOD[FIRST[S.profile&&S.profile.motive]||"apego"]; return (!S.mods[f.id])?{id:f.id,why:"Es un buen punto de partida para lo que buscas."}:{id:undone[0].id,why:"Es la estrella que te falta encender."};
}
function nextFor(id,res){
  const k=res&&res.key; let n=null,why="";
  if(id==="apego"){ if(k==="A"||k==="D"){n="noviazgo";why="Tu tendencia busca mucha seguridad: afinar tu radar de relaciones sanas te va a servir.";} else if(k==="E"){n="lenguajes";why="Descubrir cómo das y recibes cariño puede ayudarte a expresarte más.";} else {n="matrimonio";why="Con una base segura, vale la pena mirar qué significa comprometerse.";} }
  else if(id==="liquidas"){n=(k==="Vínculos sólidos")?"matrimonio":"noviazgo";why=(k==="Vínculos sólidos")?"Tus vínculos son firmes: explora el compromiso a largo plazo.":"Para contrarrestar la liquidez, nada mejor que entrenar el radar de lo sano.";}
  else if(id==="lenguajes"){n="apego";why="Tu forma de recibir amor tiene raíces: el apego te ayuda a entenderlas.";}
  else if(id==="noviazgo"){n="sexualidad";why="Un noviazgo sano también cuida la sexualidad con libertad y respeto.";}
  else if(id==="matrimonio"){n="liquidas";why="Contrasta tu idea de compromiso con la cultura del “siguiente”.";}
  else if(id==="sexualidad"){n="apego";why="Conocer tu forma de vincularte completa la mirada integral.";}
  if(n&&S.mods[n]){const u=MODS.find(m=>!S.mods[m.id]);if(!u)return null;return {id:u.id,why:"Es la estrella que te falta encender."};}
  return n?{id:n,why}:null;
}

const STEPS=["Conocerse","Reflexionar","Comprender","Decidir"];
function stepsBar(i){return `<div class="steps">${STEPS.map((s,k)=>`<span class="${k===i?"on":k<i?"past":""}">${k+1}. ${s}</span>`).join("")}</div>`;}
function startModule(id){

  const m=MOD[id]; R={id,m,step:"intro",qi:0,sc:{},hits:0,total:0,missed:[],li:0,pre:"",ord:[],shuf:null};

    </div></div>`;
  $("#start").addEventListener("click",()=>{if(m.pre)R.pre=$("#pre").value.trim();countdown(()=>{R.step="q";renderQ();});});

function countdown(cb){
  if(reduce){cb();return;} const o=document.createElement("div");o.className="count";document.body.appendChild(o);
  let n=3;const t=()=>{if(n===0){o.innerHTML="<b>¡Ya!</b>";SFX.go();setTimeout(()=>{o.remove();cb();},550);return;}o.innerHTML=`<b>${n}</b>`;SFX.tick();n--;setTimeout(t,700);};t();
}
function qOptions(q){
  if(q.t==="pair") return [q.a,q.b];
  if(q.t==="light") return [{x:"Tranquilo/a",c:"cg",w:q.w.g},{x:"Inseguro/a",c:"cy",w:q.w.y},{x:"Muy ansioso/a o molesto/a",c:"cr",w:q.w.r}];
  if(q.t==="tf") return [{x:"Verdadero",ok:q.a===true,c:"c1"},{x:"Falso",ok:q.a===false,c:"c0"}];
  if(q.t==="flag") return [{x:"Señal sana",ok:q.a==="sano",c:"cg"},{x:"Señal de alerta",ok:q.a==="alerta",c:"cr"}];
  return q.o;
}
const isLearn=q=>q.t==="tf"||q.t==="flag"||(q.o&&q.o.some(o=>o.ok));
function renderQ(){
  const m=R.m,q=m.qs[R.qi],n=m.qs.length;
  const head=`<div class="qhead">${shape(m.shape,m.color)}<b>${esc(m.name)}</b><div class="bar" aria-hidden="true"><i style="width:${R.qi/n*100}%"></i></div><span class="chip">${R.qi+1} / ${n}</span></div>${stepsBar(0)}`;
  const kick=q.k||(q.t==="flag"?"¿Señal sana o de alerta?":q.t==="pair"?"¿Qué prefieres?":"Pregunta");
  let body="";
  if(q.t==="order"){
    if(!R.shuf){R.shuf=q.items.map((x,i)=>i).sort(()=>Math.random()-.5);R.ord=[];}
    body=`<div class="qcard"><div class="qk">${esc(kick)}</div><div class="qt">${esc(q.q)}</div></div>
      <div class="grid2"><div class="tiles" id="ordtiles" style="grid-template-columns:minmax(0,1fr)">${R.shuf.map((i,k)=>`<button class="tile c${k%5}" data-oi="${i}" ${R.ord.includes(i)?"disabled style='opacity:.3'":""}>${shape(TILESH[k%5])}${esc(q.items[i])}</button>`).join("")}</div>
      <div class="order-slots" id="slots">${q.items.map((_,k)=>`<div class="slot ${R.ord[k]!=null?"filled":""}"><b>${k+1}</b><span>${R.ord[k]!=null?esc(q.items[R.ord[k]]):'<span class="dim">…</span>'}</span></div>`).join("")}</div></div>
      <div class="row"><button class="btn ghost small" id="oreset">Reiniciar</button><button class="btn gold" id="ocheck" ${R.ord.length<q.items.length?"disabled":""}>Comprobar</button></div><div id="rv"></div>`;
  } else if(q.t==="scale"){
    const cols=["var(--red)","var(--yellow)","var(--violet)","var(--blue)","var(--green)"];
    body=`<div class="qcard"><div class="qk">${esc(kick)}</div><div class="qt">${pz(q.q)}</div></div>
      <div class="stack" style="gap:10px"><div class="scale" role="group" aria-label="Del 1 al 5">${[1,2,3,4,5].map(v=>`<button data-sv="${v}" style="background:${cols[v-1]};${v===2?"color:#2a1700":""}" aria-label="${v} de 5">${v}</button>`).join("")}</div>
      <div class="scale-l"><span>Nada</span><span>Totalmente</span></div></div>`;
  } else {
    const ops=qOptions(q);
    body=`<div class="qcard"><div class="qk">${esc(kick)}</div><div class="qt">${pz(q.q)}</div></div>

function bindOrder(q){
  app.querySelectorAll("[data-oi]").forEach(b=>b.addEventListener("click",()=>{SFX.tap();R.ord.push(+b.dataset.oi);renderQ();}));
  $("#oreset").addEventListener("click",()=>{R.ord=[];renderQ();});

    const ok=R.ord.every((v,k)=>v===k); R.total++; if(ok){R.hits++;SFX.good();}else{SFX.bad();R.missed.push("El orden del proceso amoroso: disposición, flechazo, enamoramiento y amor maduro.");}

function pick(i){

    const ri=ops.findIndex(x=>x.ok); tl.children[ri].classList.add("right"); tl.children[ri].insertAdjacentHTML("beforeend",`<span class="mark">✓</span>`);
    addPts(ok?150:100);
    $("#rv").innerHTML=`<div class="reveal ${ok?"good":"bad"}">${owl("owl",ok?"happy":"look")}<div><h3>${ok?pickOne(["¡Bien visto!","¡Exacto!","¡Radar fino!","¡Eso es!"]):pickOne(["Mmm, no exactamente","Casi","Ojo con esta"])}</h3><p>${esc(q.why)}</p><div style="margin-top:12px"><button class="btn gold" id="nx">Siguiente</button></div></div></div>`;
    $("#nx").addEventListener("click",nextQ);$("#nx").focus();
  } else {
    SFX.tap(); for(const [k,v] of Object.entries(o.w||{})) R.sc[k]=(R.sc[k]||0)+v; addPts(100);
    if(q.tip){$("#rv").innerHTML=`<div class="reveal info">${owl("owl")}<div><h3>Dato de Hoot</h3><p>${esc(q.tip)}</p><div style="margin-top:12px"><button class="btn gold" id="nx">Siguiente</button></div></div></div>`;$("#nx").addEventListener("click",nextQ);$("#nx").focus();}
    else setTimeout(nextQ,reduce?150:650);
  }
}

function setupAI(){
  const box=$("#aibox"); if(!SAMPLE||!box) return; box.hidden=false; let ctl=null;
  $("#askai").addEventListener("click",async()=>{
    const b=$("#askai"),out=$("#aiout"),st=$("#stopai"); b.disabled=true; st.hidden=false; out.textContent="Hoot está pensando…"; ctl=new AbortController();
    const j=$("#jr").value.trim(); const m=R.m;
    const prompt=`Eres Hoot, el búho guía de CoreHoot, una plataforma educativa del curso Persona y Afectividad (Core II) de la Universidad de La Sabana. Escribe en español de Colombia, con tono cálido, cercano y respetuoso, para ${nameOf()==="Explorador/a"?"un joven":"un joven llamado "+nameOf()}.

${j?`Su reflexión escrita: "${j.slice(0,1500)}"`:"No escribió reflexión."}

Escribe una lectura personal de 110 a 150 palabras que: 1) reconozca algo valioso de su resultado, 2) lo conecte con una idea del curso nombrando al autor, 3) proponga un paso concreto para esta semana, 4) cierre con una pregunta para seguir reflexionando. No diagnostiques ni uses etiquetas clínicas, no des consejo médico y no moralices. Si su texto menciona violencia, abuso o riesgo, sugiere con suavidad hablar con alguien de confianza o con Bienestar Universitario. Responde solo con texto plano, sin títulos ni listas.`;
    try{ const r=await SAMPLE(prompt,{signal:ctl.signal,modelTier:"quick",onText:({text})=>{out.textContent=text;}}); out.textContent=r.text; addPts(50); S.mods[m.id]=Object.assign(S.mods[m.id]||{}, {ai:r.text}); save(); }
    catch(e){ if(e&&e.text) out.textContent=e.text; else out.textContent="";

}

      <div class="card stack"><div class="eyebrow">La visión</div><h3>Una generación que se conozca mejor</h3>
        <p class="muted">Jóvenes autoconscientes, reflexivos y autónomos, con mayor educación emocional. Noviazgos saludables, relaciones con apego seguro, vínculos conscientes y relaciones con compromiso y propósito.</p></div></div>
    <div class="card stack"><div class="eyebrow">Árbol de problemas</div>
      <div class="grid3">
        <div class="stack" style="gap:6px"><b>Causas</b><ul class="clean small muted"><li>Falta de educación afectiva</li><li>Poco autoconocimiento</li><li>Influencia de redes sociales</li><li>FOMO y FOBO</li><li>Búsqueda de gratificación inmediata</li><li>Idealización del amor</li><li>Baja tolerancia a la frustración</li></ul></div>
        <div class="stack" style="gap:6px;align-items:center;justify-content:center;text-align:center"><span class="chip" style="background:var(--gold);color:var(--ink)">Problema central</span><h3>Dificultad para construir relaciones afectivas profundas y conscientes</h3></div>
        <div class="stack" style="gap:6px"><b>Efectos</b><ul class="clean small muted"><li>Relaciones inestables</li><li>Miedo al compromiso</li><li>Dificultad para establecer límites</li><li>Desapego emocional</li><li>Confusión emocional</li><li>Dependencia o evitación emocional</li><li>Dificultad para construir vínculos duraderos</li></ul></div></div></div>
    <div class="card stack"><div class="eyebrow">Por qué funciona</div><h3>Conocerse → Reflexionar → Comprender → Decidir</h3>
      <p class="muted">Cada módulo convierte conceptos del curso en una experiencia de descubrimiento, no de evaluación. Combina lo digital con la reflexión personal para que el usuario piense sobre sí mismo y no solo busque validación o comparación en redes.</p>
      <div class="tablewrap"><table class="ref"><thead><tr><th>Módulo</th><th>Mecánica</th><th>Sustento</th></tr></thead><tbody>
        <tr><td>Apego</td><td>Semáforo emocional y escenarios</td><td>Bowlby (1969); Waldinger (2015)</td></tr>
        <tr><td>Lenguajes del amor</td><td>Elecciones en pares y cómo das cariño</td><td>Chapman (2011); Yepes y Aranguren (2003)</td></tr>
        <tr><td>Noviazgos saludables</td><td>Verdadero o falso, señales sanas o de alerta, tipos de amistad</td><td>Conen (2017); Rojas (2013); Aristóteles (1985)</td></tr>
        <tr><td>Matrimonio</td><td>Ordenar el proceso amoroso, identificar actos del amor, Carta 2036</td><td>Yepes y Aranguren (2003); Aristóteles (1985)</td></tr>
        <tr><td>Sexualidad</td><td>Dimensiones de la persona, consentimiento y brújula de autocuidado</td><td>Yepes y Aranguren (2003); Conen (2017)</td></tr>
        <tr><td>Relaciones líquidas</td><td>Simulación de escenas del celular con medidores</td><td>Bauman (2005); McGinnis (2020); Rojas (1992); Han (2012); Turkle (2017); Illouz (2012)</td></tr>
      </tbody></table></div></div>
    <div class="grid2">
      <div class="card stack"><div class="eyebrow">Para quién</div><ul class="clean muted"><li>Jóvenes de 16 a 26 años.</li><li>Personas interesadas en autoconocimiento, relaciones conscientes y bienestar emocional.</li><li>Cualquier dispositivo con internet: computador o celular.</li></ul>
        <div class="eyebrow" style="margin-top:8px">Privacidad</div><p class="small muted">No hay cuentas ni servidores: las respuestas se guardan solo en el navegador de cada persona. Compartir nunca incluye el diario.</p></div>
      <div class="card stack"><div class="eyebrow">Equipo</div>${team.map(t=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px"><b>${t[0]}</b><span class="small muted">${t[1]}</span></div>`).join("")}<p class="small dim">Proyecto Core II · Persona y Afectividad · Universidad de La Sabana · Instituto de La Familia</p></div></div>
